workflow: review
version: 1
input_schema:
  type: object
  additionalProperties: false
  required: [judge_model, coder_model]
  properties:
    judge_model: { type: string }
    coder_model: { type: string }
imports:
  analyzer: ./analyzer.awf.yaml
agents:
  judge:
    uses: awf/llm
    model: "{{ input.judge_model }}"
    system_prompt: "You are a strict reviewer. Be concise."
  coder:
    uses: awf/llm
    model: "{{ input.coder_model }}"
    with:
      provider: anthropic
      max_tokens: 2048
graph:
  - id: draft
    uses: coder
    with:
      prompt: "Draft a one-sentence release note for a CLI flag --json that adds JSON output."

  - id: review
    uses: judge
    with:
      prompt: "Review this draft release note for a CLI flag --json that adds JSON output: is it accurate and concise? List concrete fixes."

  - id: deep
    call: analyzer
    input:
      model: "{{ input.coder_model }}" # explicit pass — child privacy intact; child binds its own role
