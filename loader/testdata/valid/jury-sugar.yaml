workflow: jury-panel
version: 1
containers:
  c:
    image: oci://example.com/panel@sha256:1111111111111111111111111111111111111111111111111111111111111111
graph:
  - gate:
      generate:
        - id: gen
          container: c
          run: ./propose.sh
      evaluate:
        - id: judge
          container: c
          uses: openai/codex
          with:
            prompt: review
            model: base
          output_schema:
            type: object
            properties:
              accept:
                type: boolean
              critique:
                type: string
          jury:
            over:
              - model: gpt-5
              - model: o3
              - model: sonnet-5
            quorum: 2
            field: accept
      until: "{{ evaluate.accept }}"
      max_attempts: 3
